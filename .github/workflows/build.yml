name: Build & Release Shalimar Store APKs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Split-per-ABI APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Keystore & Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/shalimar-release-key.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=shalimar-release-key.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "✅ Release keystore and key.properties configured successfully."
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 not set, falling back to debug."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Split APKs
        run: flutter build apk --split-per-abi --release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shalimar-store-split-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish Release Asset to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --clobber || gh release create ${{ github.ref_name }} build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --title "Shalimar Store ${{ github.ref_name }}" --generate-notes
