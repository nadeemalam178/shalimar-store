name: Build & Release Shalimar Store APKs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Split-per-ABI APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Keystore & Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/shalimar-release-key.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=shalimar-release-key.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "✅ Release keystore and key.properties configured successfully."
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 not set, falling back to debug."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Split APKs
        run: flutter build apk --split-per-abi --release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shalimar-store-split-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish Release Asset to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine target tag name from git ref or pubspec.yaml
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] || [ -z "$TAG" ]; then
            VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r\n ')
            TAG="v$VERSION"
          fi
          echo "Target Release Tag: $TAG"

          # Collect all split APKs produced by flutter build
          APK_FILES=(build/app/outputs/flutter-apk/*.apk)
          echo "Found APK assets to upload: ${APK_FILES[*]}"

          # Check if the release already exists on GitHub
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists. Uploading split APKs and updating release notes..."
            gh release upload "$TAG" "${APK_FILES[@]}" --clobber
            if [ -f release_notes.md ]; then
              gh release edit "$TAG" --notes-file release_notes.md --title "Shalimar Store $TAG"
            fi
          else
            echo "Release $TAG does not exist. Creating new release with APK assets..."
            if [ -f release_notes.md ]; then
              gh release create "$TAG" "${APK_FILES[@]}" --title "Shalimar Store $TAG" --notes-file release_notes.md
            else
              gh release create "$TAG" "${APK_FILES[@]}" --title "Shalimar Store $TAG" --generate-notes
            fi
          fi
