name: shalimar_store
description: "Shalimar Store - Since 1988. Official General Store & Grocery App."
publish_to: 'none'
version: 4.0.0+18

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  firebase_core: ^3.12.0
  firebase_auth: ^5.4.4
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.5
  supabase_flutter: ^2.5.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/